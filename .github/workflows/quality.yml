name: quality

on:
  pull_request:
  push:

permissions:
  contents: read

defaults:
  run:
    working-directory: unified-system

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: unified-system
      - name: Synchronize locked environment
        run: uv sync --frozen
      - name: Run tests, wheel journey, and scale regression
        run: uv run --frozen pytest

  static-quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          working-directory: unified-system
      - name: Synchronize locked environment
        run: uv sync --frozen
      - name: Run Ruff
        run: uv run --frozen ruff check src/embed_toolkit tests examples benchmarks
      - name: Type-check the complete package
        run: uv run --frozen mypy

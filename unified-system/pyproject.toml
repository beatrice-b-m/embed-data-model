[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embed-toolkit-unified"
version = "0.1.0"
description = "Greenfield EMBED mammography object toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

[dependency-groups]
dev = [
    "build>=1.2",
    "pandas>=2.0",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
